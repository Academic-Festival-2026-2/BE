name: BE CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

# PR: 같은 PR에 새 커밋이 올라오면 이전 실행 취소
# dev push: 커밋마다 따로 실행(취소·대기열 교체 없음) → 어느 머지에서 깨졌는지 확인 가능
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # 이 이름이 dev 보호 규칙의 필수 체크 이름. 바꾸면 보호 규칙도 같이 수정
    name: BE test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pixel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            pixel/*.gradle*
            pixel/gradle/wrapper/gradle-wrapper.properties

      # 테스트는 H2 메모리 DB를 써서 DB·AWS 키·.env가 필요 없음
      - name: Test
        run: ./gradlew test --no-daemon

      # 실패했을 때만 테스트 리포트를 내려받을 수 있게 올림
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: be-test-report
          path: pixel/build/reports/tests/test
          retention-days: 7
