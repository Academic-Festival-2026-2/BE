services:
  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        # db/ SQL 실행이 끝난 뒤에 서버를 켠다 (ddl-auto: validate라 테이블이 먼저 있어야 함)
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_URL=jdbc:mysql://db:3306/binteum?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - DB_USERNAME=user
      - DB_PASSWORD=password

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=binteum
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root
      - TZ=Asia/Seoul
    ports:
      - "3307:3306"
    volumes:
      - binteum_mysql_data:/var/lib/mysql
      # 볼륨이 비어 있을 때(첫 실행) db/*.sql을 이름 순서대로 실행. 하위 폴더(legacy/)는 실행하지 않음
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 초기화 중에는 MySQL이 TCP를 닫아 두므로, 127.0.0.1로 확인해야 SQL이 끝난 뒤에 healthy가 된다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  binteum_mysql_data:
