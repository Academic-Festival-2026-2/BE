spring:
  application:
    name: pixel

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pixel?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 테이블은 db/*.sql로 만든다. Hibernate는 엔티티와 맞는지만 검사
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

jwt:
  # 로컬/데모 전용 기본키(공개됨). 배포 환경은 application-prod.yml에서 JWT_SECRET 필수
  secret: ${JWT_SECRET:cQO5+HLU/JP8dpllmAJRenERnhm0eKPsdvpQ0vxkY1ZqdW/avvtPZ4GmOV5itgqnIMNe8TRqKAomZRyKI7deTQ==}
  access-token-expiration: 1800000      # 30분 (ms)
  refresh-token-expiration: 1209600000  # 14일 (ms)

moderation:
  # 업로드 사진 AI 검수. 끄면 외부 API를 부르지 않고 모두 PUBLIC으로 저장(로컬·테스트·시드 등록)
  enabled: ${MODERATION_ENABLED:false}
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${MODERATION_MODEL:claude-haiku-5-5}
  timeout-ms: ${MODERATION_TIMEOUT_MS:4000}
  max-retries: ${MODERATION_MAX_RETRIES:0}

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.web: INFO