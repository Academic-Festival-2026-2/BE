spring:
  application:
    name: pixel

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

jwt:
  # 기본값 없음: JWT_SECRET 환경 변수가 없으면 서버가 시작되지 않음
  secret: ${JWT_SECRET}

moderation:
  # 기본은 꺼짐(모든 사진 PUBLIC). 켜려면 서버 .env에 MODERATION_ENABLED=true와 ANTHROPIC_API_KEY를 넣는다.
  # 켠 상태에서 ANTHROPIC_API_KEY가 없으면 서버가 시작되지 않음
  # 시연 중 API 장애가 계속되면 MODERATION_ENABLED=false로 끄고 재시작
  enabled: ${MODERATION_ENABLED:false}
  api-key: ${ANTHROPIC_API_KEY}

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
