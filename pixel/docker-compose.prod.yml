name: pixel-prod
# 운영 서버(EC2)용. 실행: docker compose -f docker-compose.prod.yml up -d --build
# DB는 AWS RDS(MySQL 8.4). 접속 주소와 비밀값은 같은 폴더의 .env(서버에만 있음, Git 제외)에서 읽는다.
# AWS 키는 넣지 않는다(EC2 IAM 역할 사용).
services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # Nginx만 접근. 외부에서 8080 직접 접속 불가
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 예: jdbc:mysql://<RDS 엔드포인트>:3306/pixel?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      - DB_URL=${DB_URL:?.env에 DB_URL(RDS 주소)이 없습니다}
      - DB_USERNAME=pixel
      - DB_PASSWORD=${DB_PASSWORD:?.env에 DB_PASSWORD가 없습니다}
      - JWT_SECRET=${JWT_SECRET:?.env에 JWT_SECRET이 없습니다}
      - AWS_REGION=ap-northeast-2
      - AWS_S3_BUCKET=pixel-cs24-prod
      - TZ=Asia/Seoul
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
