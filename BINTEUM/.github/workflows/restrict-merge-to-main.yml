name: Enforce Dev to Main Merge Rule

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if source branch is dev
        if: github.head_ref != 'dev'
        run: |
          echo "🚨 Error: main 브랜치로는 오직 dev 브랜치만 PR을 생성하고 Merge할 수 있습니다."
          echo "현재 시도한 브랜치: ${{ github.head_ref }}"
          exit 1

      - name: Success
        if: github.head_ref == 'dev'
        run: echo "✅ 소스 브랜치가 dev임을 확인했습니다. 검증 통과."